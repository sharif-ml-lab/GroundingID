name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tooling
        run: python -m pip install ruff
      - name: Compile experiment scripts
        run: python -m compileall -q experiments
      - name: Check fatal Python errors
        run: ruff check experiments --select E9,F63,F7,F82
